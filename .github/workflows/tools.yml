name: tools

on: [push, pull_request]

jobs:
  run-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run every tool script
        run: |
          for f in tools/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
